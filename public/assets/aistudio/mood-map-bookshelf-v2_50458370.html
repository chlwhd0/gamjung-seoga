<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감정서가 | 기분으로 찾는 책</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root {
  --page: #EFE3CC;
  --panel: #F8F0DF;
  --ink: #3A2A1D;
  --soft: #6F5944;
  --line: #CFB993;
  --leather: #5A3822;
  --on-leather: #F6EAD3;
  --sign-bg: #5A3822;
  --brass: #96661F;
  --track: #E2D2B3;
  --err: #9C2A2A;
  --err-bg: #F7E1DC;
  --ok: #3E5B2E;
  --grain: 0.22;
  --focus: #1E5FA8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #1D1510; --panel: #2A1F17; --ink: #EDE0C8; --soft: #BBA383; --line: #4B3A2A;
    --leather: #C58B4A; --on-leather: #22160D; --sign-bg: #2E2016; --brass: #D8A650; --track: #3C2D20;
    --err: #F0A0A0; --err-bg: #3A2121; --ok: #A9D79B; --grain: 0.08; --focus: #8DB8F5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #1D1510; --panel: #2A1F17; --ink: #EDE0C8; --soft: #BBA383; --line: #4B3A2A;
  --leather: #C58B4A; --on-leather: #22160D; --sign-bg: #2E2016; --brass: #D8A650; --track: #3C2D20;
  --err: #F0A0A0; --err-bg: #3A2121; --ok: #A9D79B; --grain: 0.08; --focus: #8DB8F5;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--page); color: var(--ink); font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 1rem; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--grain);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .24 0 0 0 0 .12 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.serif { font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.sign { position: relative; z-index: 1; background: var(--sign-bg); color: #F6EAD3; border-bottom: 5px double var(--brass); }
.sign-in { max-width: 64rem; margin: 0 auto; padding: 1.25rem 1.25rem; display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.sign h1 { font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-weight: 800; font-size: 1.75rem; letter-spacing: .1em; margin: 0; }
.sign p { margin: 0; opacity: .9; }

main { position: relative; z-index: 1; max-width: 64rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
.panel-intro { margin: 0 0 1.5rem; color: var(--soft); }
.cols { display: grid; gap: 2.25rem; }
@media (min-width: 56rem) { .cols { grid-template-columns: minmax(0, 25rem) minmax(0, 1fr); gap: 3rem; align-items: start; } }
h2 { font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-size: 1.25rem; font-weight: 800; margin: 0 0 .25rem; }
.hint { margin: 0 0 1rem; color: var(--soft); font-size: .9375rem; }
.frame { background: var(--panel); border: 1px solid var(--line); box-shadow: inset 0 0 0 4px var(--panel), inset 0 0 0 5px var(--line); padding: 1.25rem; border-radius: .125rem; }

/* 마음의 날씨 카드 */
.moods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.mood { font: inherit; color: var(--ink); text-align: center; background: var(--page); border: 1px solid var(--line); border-radius: .25rem; padding: .7rem .35rem .6rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .1rem; min-height: 5.6rem; }
.mood .icon { width: 2rem; height: 2rem; color: var(--brass); display: block; }
.mood .icon svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mood .name { font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-weight: 800; font-size: 1.0625rem; }
.mood .phrase { font-size: .75rem; color: var(--soft); line-height: 1.4; }
.mood:hover { border-color: var(--brass); }
.mood[aria-pressed="true"] { background: var(--leather); border-color: var(--brass); color: var(--on-leather); box-shadow: inset 0 0 0 2px var(--leather), inset 0 0 0 3px var(--brass); }
.mood[aria-pressed="true"] .icon { color: var(--on-leather); }
.mood[aria-pressed="true"] .phrase { color: var(--on-leather); opacity: .88; }

.field { margin-top: 1.4rem; }
.label-row { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; margin-bottom: .45rem; font-size: .875rem; font-weight: 600; }
.readout { font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-weight: 800; font-size: 1.125rem; color: var(--brass); }
.gauge-note { margin: .25rem 0 0; font-size: .8125rem; color: var(--soft); }
.gauge-wrap { padding: 0 .125rem; }
input[type="range"].gauge { -webkit-appearance: none; appearance: none; width: 100%; height: 1.75rem; margin: 0; background: transparent; cursor: pointer; --fill: 50%; }
input[type="range"].gauge::-webkit-slider-runnable-track { height: .75rem; border-radius: 999px; border: 1px solid var(--line); background: linear-gradient(to right, var(--brass) 0, var(--brass) var(--fill), var(--track) var(--fill), var(--track) 100%); }
input[type="range"].gauge::-moz-range-track { height: .75rem; border-radius: 999px; border: 1px solid var(--line); background: var(--track); }
input[type="range"].gauge::-moz-range-progress { height: .75rem; border-radius: 999px; background: var(--brass); }
input[type="range"].gauge::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 1.625rem; height: 1.625rem; margin-top: -.5625rem; border-radius: 50%; background: var(--leather); border: 3px solid var(--brass); }
input[type="range"].gauge::-moz-range-thumb { width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--leather); border: 3px solid var(--brass); }
.ticks { display: flex; justify-content: space-between; margin: .125rem 0 0; padding: 0; list-style: none; font-size: .875rem; color: var(--soft); }
.ticks li[aria-current="true"] { color: var(--ink); font-weight: 700; }
.field.locked .readout, .field.locked .ticks { opacity: .45; }
input[type="range"].gauge:disabled { opacity: .45; cursor: not-allowed; }

.count { font-weight: 500; color: var(--soft); font-variant-numeric: tabular-nums; } .count.warn { color: var(--err); font-weight: 700; }
.free { display: block; width: 100%; font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: .25rem; padding: .6rem .75rem; resize: none; line-height: 1.5; min-height: 3.4rem; }
.free::placeholder { color: var(--soft); opacity: .85; }

.cta-bar { margin-top: 1.4rem; }
.go { width: 100%; font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-weight: 800; font-size: 1.125rem; letter-spacing: .04em; color: var(--on-leather); background: var(--leather); border: 0; border-radius: .25rem; padding: .875rem 1rem; min-height: 3.25rem; cursor: pointer; box-shadow: inset 0 0 0 2px var(--leather), inset 0 0 0 3px var(--brass); display: flex; align-items: center; justify-content: center; gap: .6rem; }
.go[aria-disabled="true"] { opacity: .6; }
.go:disabled { opacity: .75; cursor: progress; }
.go.is-busy::before { content: ""; width: 1.05rem; height: 1.05rem; border-radius: 50%; border: 3px solid rgba(246, 234, 211, .35); border-top-color: var(--on-leather); animation: spin .9s linear infinite; }
.status { min-height: 1.5rem; margin: .6rem 0 0; color: var(--soft); font-size: .9375rem; }
@media (max-width: 55.99rem) {
  .cta-bar { position: sticky; bottom: 0; z-index: 3; margin: 1.2rem -1.25rem -1.25rem; padding: .9rem 1.25rem 1rem; background: linear-gradient(to bottom, transparent, var(--panel) 26%); }
}

/* 결과 영역 */
.table-head { border-bottom: 5px double var(--brass); padding-bottom: .55rem; }
.table-head .outtitle { margin: 0; }
.for { margin: .15rem 0 0; font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-weight: 700; font-size: .95rem; line-height: 1.4; color: var(--brass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .for:empty { display: none; }

.notice { display: flex; gap: .65rem; align-items: flex-start; margin: 1rem 0 0; padding: .7rem .9rem; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--soft); border-radius: .25rem; font-size: .9375rem; line-height: 1.5; }
.notice[hidden] { display: none; }
.notice .n-ic { flex: none; width: 1.25rem; height: 1.25rem; margin-top: .12rem; border-radius: 50%; position: relative; }
.notice .n-tx { flex: 1; min-width: 0; }
.notice .n-act { flex: none; font: inherit; font-size: .875rem; font-weight: 700; color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: .25rem; padding: .35rem .8rem; min-height: 2.25rem; cursor: pointer; }
.notice[data-kind="error"] { border-left-color: var(--err); background: var(--err-bg); }
.notice[data-kind="error"] .n-ic { background: var(--err); }
.notice[data-kind="error"] .n-ic::after { content: "!"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--err-bg); font-weight: 800; font-size: .85rem; }
.notice[data-kind="progress"] { border-left-color: var(--brass); }
.notice[data-kind="progress"] .n-ic { border: 3px solid var(--line); border-top-color: var(--brass); animation: spin .9s linear infinite; }
.notice[data-kind="success"] { border-left-color: var(--ok); }
.notice[data-kind="success"] .n-ic { background: var(--ok); }
.notice[data-kind="success"] .n-ic::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--panel); font-weight: 800; font-size: .8rem; }
.notice[data-kind="info"] .n-ic { background: var(--soft); }
.notice[data-kind="info"] .n-ic::after { content: "i"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--panel); font-weight: 800; font-size: .8rem; font-family: "Nanum Myeongjo", serif; }
@keyframes spin { to { transform: rotate(360deg); } }

.understood:not(:empty) { margin: 1rem 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.u-chip { display: inline-block; padding: .35rem .8rem; border: 1.5px solid var(--brass); border-radius: 999px; background: var(--panel); font-weight: 600; font-size: .9375rem; }
.u-fix { font: inherit; font-size: .875rem; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--soft); padding: .35rem 0; min-height: 2.25rem; cursor: pointer; }
.u-list { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; padding: .6rem .75rem; background: var(--panel); border: 1px solid var(--line); border-radius: .25rem; font-size: .875rem; }
.u-list[hidden] { display: none; }
.u-list button { font: inherit; font-size: .875rem; font-weight: 600; color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 999px; padding: .3rem .85rem; min-height: 2.25rem; cursor: pointer; }
.u-list button:hover { border-color: var(--brass); }

.support { margin-top: 1.25rem; padding: 1.1rem 1.25rem 1.25rem; background: var(--err-bg); border: 1px solid var(--err); border-left-width: 6px; border-radius: .25rem; }
.support[hidden] { display: none; }
.support h3 { margin: 0 0 .35rem; font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-size: 1.2rem; }
.support p { margin: 0 0 .8rem; }
.support ul { list-style: none; margin: 0 0 .8rem; padding: 0; display: grid; gap: .5rem; }
.s-call { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3rem; padding: .5rem 1rem; border: 1.5px solid var(--ink); border-radius: .3rem; background: var(--panel); color: var(--ink); text-decoration: none; }
.s-call b { font-weight: 600; } .s-call span { font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.s-em { margin: 0; font-size: .9375rem; }

.books { list-style: none; margin: 0; padding: 1.4rem 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem 1.25rem; }
.books li { min-width: 0; display: flex; flex-direction: column; }
.books li.enter { animation: rise .38s ease-out both; animation-delay: calc(var(--i, 0) * 80ms); }
@keyframes rise { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }
.cover { position: relative; aspect-ratio: 2 / 3; width: 100%; max-width: 10.5rem; background: var(--c); color: #F6EAD3; border-radius: .125rem .25rem .25rem .125rem; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: inset .3125rem 0 0 rgba(0,0,0,.25), inset 0 0 0 .25rem var(--c), inset 0 0 0 .3125rem rgba(246,234,211,.35), 0 0 0 1px rgba(246,234,211,.22); }
.cover .c-title { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: .9rem .6rem .5rem .9rem; overflow: hidden; text-align: center; }
.cover .c-tx { display: block; width: 100%; font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-weight: 800; font-size: 1.4rem; line-height: 1.32; color: rgba(246, 234, 211, .96); overflow-wrap: anywhere; }
.cover .band { padding: .3125rem .75rem .3125rem 1rem; background: #C9993F; color: #2B1D0E; font-size: .8125rem; font-weight: 700; }
.books.placeholder li .cover { background: transparent; border: 1px dashed var(--line); box-shadow: none; }
.books.placeholder li .sk { height: .75rem; border-radius: .2rem; background: var(--track); margin-top: .55rem; opacity: .6; }
.books.placeholder.loading li .cover, .books.placeholder.loading li .sk { background: linear-gradient(100deg, var(--track) 30%, var(--panel) 50%, var(--track) 70%); background-size: 220% 100%; animation: shimmer 1.4s linear infinite; border-style: solid; border-color: var(--line); opacity: .9; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.info { margin-top: .875rem; display: flex; flex-direction: column; flex: 1; }
.info h3 { font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-size: 1.0625rem; font-weight: 800; line-height: 1.4; margin: 0; }
.info .author { margin: .125rem 0 .5rem; font-size: .875rem; color: var(--soft); }
.quote { margin: 0 0 .625rem; padding: .125rem 0 .125rem .75rem; border-left: 3px solid var(--brass); font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; font-size: .9375rem; line-height: 1.65; }
.info .why { margin: 0; font-size: .875rem; color: var(--soft); }
.buy { margin-top: auto; padding-top: .875rem; position: relative; }
.buy-toggle { width: 100%; display: flex; align-items: center; justify-content: center; gap: .55rem; font: inherit; font-size: .9375rem; font-weight: 700; color: var(--on-leather); background: var(--leather); border: 1px solid var(--leather); border-radius: .25rem; padding: .5rem; min-height: 2.75rem; cursor: pointer; }
.buy-toggle::after { content: ""; width: .5rem; height: .5rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); transition: transform .2s; }
.buy-toggle[aria-expanded="true"]::after { transform: rotate(-135deg) translate(-2px, -2px); }
.buy-toggle:hover { border-color: var(--brass); }
.stores { display: grid; gap: .4rem; margin-top: .4rem; }
.stores[hidden] { display: none; }
.stores a { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; font-size: .875rem; font-weight: 600; color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: .25rem; padding: .5rem; min-height: 2.75rem; }
.stores a:hover { border-color: var(--brass); }
@media (min-width: 36.01rem) {
  .stores { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: .3rem; padding: .5rem; background: var(--panel); border: 1px solid var(--line); border-radius: .3rem; box-shadow: 0 .6rem 1.2rem rgba(58, 42, 29, .28); }
}
@media (prefers-reduced-motion: reduce) { .buy-toggle::after { transition: none; } }

.again-bar { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .6rem .9rem; align-items: center; }
.again-bar[hidden] { display: none; }
.again-btn { font: inherit; font-weight: 700; color: var(--ink); background: var(--panel); border: 1.5px solid var(--brass); border-radius: .25rem; padding: .6rem 1.2rem; min-height: 2.75rem; cursor: pointer; }
.again-btn:disabled { opacity: .55; cursor: progress; }
.again-note { flex: 1 1 14rem; margin: 0; min-width: 0; }
.empty-note { margin: 1rem 0 0; color: var(--soft); } .empty-note:empty { display: none; }
.source { margin: 1.5rem 0 0; padding-top: .75rem; border-top: 1px solid var(--line); font-size: .8125rem; color: var(--soft); } .source:empty { display: none; }

@media (max-width: 36rem) {
  .books { grid-template-columns: 1fr; }
  .books li { display: grid; grid-template-columns: 6rem minmax(0, 1fr); column-gap: 1rem; align-items: start; }
  .books li .info { margin-top: 0; }
  .cover .c-title { padding: .6rem .45rem .35rem .75rem; }
  .books.placeholder { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .books.placeholder li { display: block; }
}
@media (prefers-reduced-motion: reduce) {
  .go.is-busy::before, .notice[data-kind="progress"] .n-ic, .books.placeholder.loading li .cover, .books.placeholder.loading li .sk, .books li.enter { animation: none; }
}
</style>
</head>
<body>
<header class="sign"><div class="sign-in"><h1>감정서가</h1><p>기분으로 찾는 책</p></div></header>

<main>
<section id="panel-ai" aria-label="감정 기반 책 추천">
  <p class="panel-intro">기분을 고르거나 적어 주세요. AI가 어울리는 책 3권을 골라 드립니다.</p>
  <div class="cols">
    <section>
      <h2>오늘 마음의 날씨</h2>
      <p class="hint">지금 기분과 가장 닮은 카드를 하나 골라 주세요.</p>
      <div class="frame">
        <div class="moods" role="group" aria-label="마음의 날씨 카드"></div>

        <div class="field gauge-field">
          <div class="label-row"><span>기분의 세기</span><span class="readout" aria-hidden="true">꽤</span></div>
          <div class="gauge-wrap">
            <input class="gauge" type="range" min="1" max="5" step="1" value="3" aria-label="기분의 세기" aria-valuetext="꽤">
            <ul class="ticks" aria-hidden="true"></ul>
          </div>
          <p class="gauge-note" hidden>직접 적은 내용에는 세기를 적용하지 않습니다.</p>
        </div>

        <div class="field">
          <div class="label-row"><label for="free">카드에 없으면 직접 적어 주세요</label><span class="count"><span class="cnt">0</span>/100</span></div>
          <textarea id="free" class="free" rows="2" maxlength="100" autocomplete="off" placeholder="예: 허무함, 내일 발표라 잠이 안 와요"></textarea>
        </div>

        <div class="cta-bar">
          <button class="go" type="button" aria-disabled="true">AI에게 추천받기</button>
          <p class="status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section id="results" aria-labelledby="outTitle">
      <div class="table-head"><h2 class="outtitle" id="outTitle">추천 도서</h2><p class="for"></p></div>
      <div class="understood" aria-live="polite"></div>
      <div class="notice res-notice" hidden><span class="n-ic" aria-hidden="true"></span><span class="n-tx"></span><button class="n-act" type="button" hidden>다시 시도</button></div>
      <div class="support" role="region" aria-label="도움 안내" hidden></div>
      <ul class="books"></ul>
      <div class="again-bar" hidden>
        <button type="button" class="again-btn">다른 책 보기</button>
        <div class="notice inline again-note" hidden><span class="n-ic" aria-hidden="true"></span><span class="n-tx"></span></div>
      </div>
      <p class="empty-note"></p>
      <p class="source"></p>
    </section>
  </div>
</section>
</main>

<script>
(function () {
  var ICONS = {
